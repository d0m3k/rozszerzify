# Real client IP: traffic reaches nginx only via cloudflared (localhost),
# which sets CF-Connecting-IP on every proxied request. That is the true
# client IP; $remote_addr alone would always be 127.0.0.1. Direct local
# hits (no header) fall back to the socket peer address.
map $http_cf_connecting_ip $rz_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name rozszerzify.dom3k.pl;

    # Frontend static files (PWA build output)
    root /opt/rozszerzify/frontend/dist;
    index index.html;

    # API proxy to Go backend — never cache
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rz_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Service worker — always revalidate (ETag/304 ok) so updates land fast
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # Hashed assets — cache forever
    location ~* "^/assets/.+\.[a-f0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manifest must revalidate (Chrome WebAPK caches icons off it)
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # Versioned icons via ?v= in manifest — cache long
    location ~* "^/(icon-(192|512)(-maskable)?\.png)$" {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Unversioned icons / favicon
    location ~* "^/(favicon\.svg)$" {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        expires -1;
    }
}